[tool.poetry]
name = "contracts"
version = "0.1.0"
description = "Pydantic source-of-truth contracts shared across cockpit-api and agents."
authors = ["Kamal Singh <kamalkantsingh10@gmail.com>"]
readme = "README.md"
packages = [{ include = "contracts", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.13.3"
python-ulid = "^3.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.12"
mypy = "^1.20.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_lint -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["contracts"]
explicit_package_bases = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
