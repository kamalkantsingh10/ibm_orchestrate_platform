# Real pre-commit configuration (Story 1.3 — replaces 1.1 stub).
# Quality gates per architecture.md#Quality gates:
#   Ruff (lint + format) + mypy strict on Python; ESLint --max-warnings=0 +
#   Prettier on TypeScript; gitleaks for secrets; actionlint for workflow YAML;
#   stock hygiene hooks. CI runs `pre-commit run --all-files` as a pre-flight
#   in .github/workflows/ci.yml.
#
# Local install: `make bootstrap` runs `poetry install` at the repo root (which
# installs pre-commit) and then `pre-commit install --install-hooks`.
# Manual run: `poetry run pre-commit run --all-files` from the repo root.

# Globally skip vendored / generated content: BMAD framework files
# (.claude/, _bmad/) and dependency / build outputs. Per-hook excludes
# stack on top of this.
exclude: '(?x)(^\.claude/|^_bmad/|node_modules/|/\.venv/|\.lock$|^pnpm-lock\.yaml$)'

repos:
  # ─── Stock hygiene ──────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^pnpm-lock\.yaml$
      - id: end-of-file-fixer
        exclude: ^pnpm-lock\.yaml$
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
        exclude: ^.*\.vscode/.*$
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key

  # ─── Python lint/format (Ruff) ──────────────────────────────────────────────
  # Pinned to match each Python subproject's pyproject.toml (^0.15.12).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(apps/cockpit-api|apps/agents|packages/contracts|tools/verifier)/.*\.py$
      - id: ruff-format
        files: ^(apps/cockpit-api|apps/agents|packages/contracts|tools/verifier)/.*\.py$

  # ─── Secret detection ───────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # ─── GitHub Actions workflow lint (Story 1.3 Subtask 9.1) ──────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint

  # ─── Repo-wide formatting (Markdown / YAML / JSON) ─────────────────────────
  # Mirrored Prettier — runs against root-level docs and configs that aren't
  # under apps/cockpit-ui's pnpm tree. The cockpit-ui TS/JSX uses a separate
  # local hook below to invoke the package-pinned Prettier 3.8.
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(md|yml|yaml|json)$
        exclude: ^(.*/poetry\.lock|pnpm-lock\.yaml|.*/openapi\.json|apps/cockpit-ui/.*)$
        additional_dependencies: ["prettier@3.8.3"]

  # ─── Local hooks — use project-pinned tools via Poetry / pnpm ──────────────
  - repo: local
    hooks:
      # ESLint via cockpit-ui's pinned ESLint 10 + flat config.
      - id: eslint-cockpit-ui
        name: eslint (cockpit-ui, --max-warnings=0)
        language: system
        entry: bash -c 'cd apps/cockpit-ui && pnpm exec eslint --max-warnings=0 .'
        files: ^apps/cockpit-ui/.*\.(ts|tsx|js|jsx)$
        pass_filenames: false

      # Prettier --check on cockpit-ui — uses package-pinned Prettier 3.8.
      - id: prettier-cockpit-ui
        name: prettier --check (cockpit-ui)
        language: system
        entry: bash -c 'cd apps/cockpit-ui && pnpm exec prettier --check .'
        files: ^apps/cockpit-ui/.*$
        exclude: ^apps/cockpit-ui/(node_modules|dist|\.vite)/
        pass_filenames: false

      # mypy strict per Python subproject — uses each project's pinned mypy.
      # Triggered when staged files match; runs the whole subproject because
      # mypy follows imports.
      - id: mypy-cockpit-api
        name: mypy strict (cockpit-api)
        language: system
        entry: bash -c 'cd apps/cockpit-api && poetry run mypy .'
        files: ^apps/cockpit-api/.*\.py$
        pass_filenames: false
      - id: mypy-agents
        name: mypy strict (agents)
        language: system
        entry: bash -c 'cd apps/agents && poetry run mypy .'
        files: ^apps/agents/.*\.py$
        pass_filenames: false
      - id: mypy-contracts
        name: mypy strict (packages/contracts)
        language: system
        entry: bash -c 'cd packages/contracts && poetry run mypy .'
        files: ^packages/contracts/.*\.py$
        pass_filenames: false
      - id: mypy-verifier
        name: mypy strict (tools/verifier)
        language: system
        entry: bash -c 'cd tools/verifier && poetry run mypy .'
        files: ^tools/verifier/.*\.py$
        pass_filenames: false
