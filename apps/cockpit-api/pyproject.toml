[tool.poetry]
name = "cockpit-api"
version = "0.1.0"
description = "FastAPI service backing the KYC Cockpit."
authors = ["Kamal Singh <kamalkantsingh10@gmail.com>"]
readme = "README.md"
packages = [{ include = "cockpit_api", from = "src" }]
include = [{ path = "src/cockpit_api/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
# Constrained to <3.14 because apps/agents pulls ibm-watsonx-orchestrate
# which has the same upper bound. Both are installed into the same dev venv.
python = ">=3.11,<3.14"
fastapi = {extras = ["all"], version = "^0.136.1"}
sqlalchemy = {extras = ["asyncio"], version = "^2.0.49"}
pydantic = "^2.13.3"
aiosqlite = "^0.21.0"
alembic = "^1.18.4"
contracts = {path = "../../packages/contracts", develop = true}
python-ulid = "^3.0.0"
aiofiles = "^25.1.0"
# Story 3.4 ADK integration — cockpit-api hosts the
# /v1/agents/document_intelligence/extract endpoint that the ADK runtime
# calls as a tool. The path dep is bidirectional with apps/agents (which
# also has a path dep on cockpit-api for the ledger). Architecture A3
# collapses both apps into one process at runtime so the cycle is at the
# build/install boundary only.
agents = {path = "../agents", develop = true}


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.12"
mypy = "^1.20.2"
reportlab = "^4.5.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Defensive: dev machines that source ROS (e.g. /opt/ros/jazzy/setup.bash)
# leak ament/launch pytest plugins into PYTHONPATH. Disable them so the
# suite is hermetic. Harmless on machines without ROS.
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_lint -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["cockpit_api"]
explicit_package_bases = true

# aiosqlite ships no PEP 561 stubs; allow import without typeshed coverage.
[[tool.mypy.overrides]]
module = "aiosqlite"
ignore_missing_imports = true

# aiofiles ships partial type stubs; some submodules lack annotations.
[[tool.mypy.overrides]]
module = "aiofiles.*"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
