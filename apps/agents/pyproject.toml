[tool.poetry]
name = "agents"
version = "0.1.0"
description = "IBM watsonx Orchestrate ADK agents for the KYC Cockpit."
authors = ["Kamal Singh <kamalkantsingh10@gmail.com>"]
readme = "README.md"
packages = [{ include = "agents", from = "src" }]
include = [{ path = "src/agents/py.typed", format = ["sdist", "wheel"] }]

[tool.poetry.dependencies]
# ibm-watsonx-orchestrate constrains the upper bound to <3.14, so we
# match its supported range here.
python = ">=3.11,<3.14"
ibm-watsonx-orchestrate = "^2.8.0"
contracts = {path = "../../packages/contracts", develop = true}
# Story 3.2 — the @agent_action decorator imports LedgerWriter from cockpit-api.
# Architecture A3 collapses both apps into one process at runtime; this path
# dep is a build-time aid. The runtime call graph is still
# router → service → supervisor → agents (cockpit-api never imports agents).
cockpit-api = {path = "../cockpit-api", develop = true}
# Story 3.4 — pypdf for offline text extraction (watsonx mode); Jinja for
# prompt templates (transitively via FastAPI in cockpit-api but pinned here
# for explicit ownership in the prompts module).
pypdf = "^4.0.0"
jinja2 = "^3.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
pytest-asyncio = "^1.3.0"
pytest-cov = "^7.1.0"
ruff = "^0.15.12"
mypy = "^2.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:launch_testing -p no:launch_ros -p no:ament_copyright -p no:ament_lint -p no:ament_flake8 -p no:ament_pep257 -p no:ament_xmllint"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["agents"]
explicit_package_bases = true
# ibm-watsonx-orchestrate ships untyped modules in places; allow imports of
# unknown types from that namespace until upstream stubs catch up.
[[tool.mypy.overrides]]
module = "ibm_watsonx_orchestrate.*"
ignore_missing_imports = true

# pyyaml ships without bundled stubs in this venv; types-PyYAML is large
# and not worth pulling in just for a single load.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
