openapi: 3.0.3
info:
  title: KYC Screening (ADK Tool)
  version: 0.1.0
  description: Screening agent exposed for ADK runtime tool registration. The watsonx
    Orchestrate runtime calls this endpoint when an agent decides to invoke `run_screening`.
servers:
  - url: http://host.docker.internal:8000
    description: Cockpit API endpoint reachable by the Orchestrate runtime. For cloud
      Orchestrate, this is a public ngrok tunnel pointing at the developer's localhost:8000
      (refresh via `make tunnel-sync`). For local Developer Edition, this is host.docker.internal.
paths:
  /v1/agents/screening/run:
    post:
      tags:
        - agents
      summary: Run the Screening agent against a case's subjects
      description: Calls the Screening agent (Story 6.2) with the supplied case_id
        and pre-built subject list (entity / directors / UBOs). Returns the typed
        output including auto-dismissed hits. Every invocation writes one ledger entry.
      operationId: run_screening
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScreeningAgentInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreeningAgentOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ActorType:
      type: string
      enum:
        - agent
        - officer
        - system
      title: ActorType
      description: "Who originated the ledger entry. See architecture.md \xA7 P4."
    AgentActionLedgerEntry:
      properties:
        kind:
          type: string
          const: agent_action
          title: Kind
          default: agent_action
        agent_id:
          type: string
          minLength: 1
          title: Agent Id
        model_id:
          type: string
          minLength: 1
          title: Model Id
          default: stub
        prompt_template_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Prompt Template Id
        prompt_hash:
          anyOf:
            - type: string
              pattern: ^[a-f0-9]{64}$
            - type: 'null'
          title: Prompt Hash
        tool_calls:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Tool Calls
        input:
          additionalProperties: true
          type: object
          title: Input
        output:
          anyOf:
            - additionalProperties: true
              type: object
            - type: 'null'
          title: Output
        started_at:
          type: string
          format: date-time
          title: Started At
        completed_at:
          type: string
          format: date-time
          title: Completed At
        duration_ms:
          type: integer
          minimum: 0.0
          title: Duration Ms
        status:
          type: string
          enum:
            - ok
            - error
          title: Status
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
        reasoning_trace:
          anyOf:
            - $ref: '#/components/schemas/ReasoningTrace'
            - type: 'null'
      type: object
      required:
        - agent_id
        - input
        - started_at
        - completed_at
        - duration_ms
        - status
      title: AgentActionLedgerEntry
      description: Typed payload for ``agent.completed``/``agent.failed`` ledger entries.
    AgentMeshAgentEntry:
      properties:
        agent_slug:
          $ref: '#/components/schemas/AgentSlug'
        state:
          $ref: '#/components/schemas/AgentMeshAgentState'
        last_activity_at:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Last Activity At
        last_action_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Last Action Id
      type: object
      required:
        - agent_slug
        - state
      title: AgentMeshAgentEntry
      description: Per-agent snapshot row.
    AgentMeshAgentState:
      type: string
      enum:
        - idle
        - working
        - complete
        - blocked
        - needs_input
      title: AgentMeshAgentState
      description: Coarse-grained state surfaced to the cockpit pane.
    AgentMeshSnapshot:
      properties:
        case_id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Case Id
        agents:
          items:
            $ref: '#/components/schemas/AgentMeshAgentEntry'
          type: array
          title: Agents
      type: object
      required:
        - case_id
        - agents
      title: AgentMeshSnapshot
      description: Response model for ``GET /v1/cases/{case_id}/agent-mesh-state``.
    AgentRerunResponse:
      properties:
        case_id:
          type: string
          title: Case Id
        agent_slug:
          type: string
          title: Agent Slug
        agent_action_id:
          type: string
          title: Agent Action Id
        status:
          type: string
          title: Status
      type: object
      required:
        - case_id
        - agent_slug
        - agent_action_id
        - status
      title: AgentRerunResponse
      description: 'Story 6.7 / AC #4 response shape for `POST /cases/.../agents/.../run`.'
    AgentSlug:
      type: string
      enum:
        - case-supervisor
        - document-intelligence
        - entity-verification
        - ubo-graph
        - screening
        - risk-scoring
        - writing
        - cockpit-chat
      title: AgentSlug
      description: The eight MVP agents. Slug values mirror the registry directory
        names.
    Body_upload_documents_v1_cases__case_id__documents_post:
      properties:
        files:
          items:
            type: string
            contentMediaType: application/octet-stream
          type: array
          title: Files
      type: object
      required:
        - files
      title: Body_upload_documents_v1_cases__case_id__documents_post
    CaseEnvelope:
      properties:
        id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Id
        state:
          $ref: '#/components/schemas/CaseState'
        customer_metadata:
          $ref: '#/components/schemas/CustomerMetadata'
        assigned_to_user_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Assigned To User Id
        risk_band:
          anyOf:
            - type: string
              enum:
                - low
                - medium_low
                - medium_high
                - high
            - type: 'null'
          title: Risk Band
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        closure_date:
          anyOf:
            - type: string
              format: date-time
            - type: 'null'
          title: Closure Date
        latest_decision:
          anyOf:
            - $ref: '#/components/schemas/CaseLatestDecision'
            - type: 'null'
        _links:
          additionalProperties:
            anyOf:
              - type: string
              - type: 'null'
          type: object
          title: Links
      type: object
      required:
        - id
        - state
        - customer_metadata
        - created_at
        - updated_at
      title: CaseEnvelope
      description: '``Case`` plus the API-shape-only ``_links`` placeholder.'
    CaseIntakeOutcome:
      properties:
        case_id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Case Id
        status:
          type: string
          enum:
            - completed
            - blocked
          title: Status
        agents_run:
          items:
            type: string
          type: array
          title: Agents Run
        failed_agent:
          anyOf:
            - type: string
            - type: 'null'
          title: Failed Agent
        error_message:
          anyOf:
            - type: string
            - type: 'null'
          title: Error Message
        fields_extracted:
          type: integer
          minimum: 0.0
          title: Fields Extracted
          default: 0
        completed_at:
          type: string
          format: date-time
          title: Completed At
      type: object
      required:
        - case_id
        - status
        - completed_at
      title: CaseIntakeOutcome
      description: Result envelope for one case-intake supervisor run.
    CaseLatestDecision:
      properties:
        decision_id:
          type: string
          minLength: 1
          title: Decision Id
        outcome:
          type: string
          enum:
            - approve
            - decline
            - approve_with_conditions
            - escalate_to_edd
          title: Outcome
        sealed_ledger_entry_id:
          anyOf:
            - type: string
            - type: 'null'
          title: Sealed Ledger Entry Id
      type: object
      required:
        - decision_id
        - outcome
      title: CaseLatestDecision
      description: "Per-case decision summary surfaced on ``GET /v1/cases/{case_id}``.


        Story 7.6 / AC #5. ``sealed_ledger_entry_id`` is ``None`` while the

        decision is still in the 120-second undo window (state

        ``pending_seal``); populated once the seal-time ledger entry is

        written. Story 7.7 owns the ``decisions`` table that backs this; the

        envelope addition lands here so the cockpit-ui's

        ``SealedIndicator`` can read the seal id without a second round-

        trip."
    CaseListResponse:
      properties:
        items:
          items:
            $ref: '#/components/schemas/CaseEnvelope'
          type: array
          title: Items
        next_cursor:
          anyOf:
            - type: string
            - type: 'null'
          title: Next Cursor
        has_more:
          type: boolean
          title: Has More
          default: false
      type: object
      required:
        - items
      title: CaseListResponse
      description: Pagination envelope per ``architecture.md#Format Patterns``.
    CaseState:
      type: string
      enum:
        - intake_scheduled
        - decision_ready
        - pending_seal
        - committed
        - escalated
        - closed
      title: CaseState
      description: Lifecycle states. See ``ALLOWED_TRANSITIONS`` for the edge set.
    CitedClaim:
      properties:
        text:
          type: string
          maxLength: 400
          minLength: 1
          title: Text
        evidence_ledger_id:
          type: string
          maxLength: 30
          minLength: 30
          pattern: ^led_[0-9A-HJKMNP-TV-Z]{26}$
          title: Evidence Ledger Id
      type: object
      required:
        - text
        - evidence_ledger_id
      title: CitedClaim
      description: "One factual claim in the drafted rationale, paired with the

        ledger entry that backs it. The LLM emits these in structured JSON;

        the agent assembles them into HTML around each claim's text."
    CockpitChatMessageAccepted:
      properties:
        case_id:
          type: string
          title: Case Id
        message_id:
          type: string
          title: Message Id
        status:
          type: string
          title: Status
      type: object
      required:
        - case_id
        - message_id
        - status
      title: CockpitChatMessageAccepted
      description: "Story 6.8 / AC #1 \u2014 202 response shape."
    CockpitChatMessageRequest:
      properties:
        message:
          type: string
          maxLength: 2000
          minLength: 1
          title: Message
        message_id:
          type: string
          maxLength: 64
          minLength: 1
          title: Message Id
      type: object
      required:
        - message
        - message_id
      title: CockpitChatMessageRequest
      description: "Story 6.8 / AC #1 \u2014 POST body for the cockpit-chat message\
        \ route."
    CockpitChatToolLedgerPayload:
      properties:
        kind:
          type: string
          const: cockpit_chat_tool
          title: Kind
          default: cockpit_chat_tool
        tool_name:
          type: string
          enum:
            - get_case
            - get_reasoning_trace
            - re_run_agent
            - query_ledger
          title: Tool Name
        request_args:
          additionalProperties: true
          type: object
          title: Request Args
        result_summary:
          type: string
          maxLength: 500
          minLength: 1
          title: Result Summary
        duration_ms:
          type: integer
          minimum: 0.0
          title: Duration Ms
        status:
          type: string
          enum:
            - ok
            - error
          title: Status
        error:
          anyOf:
            - $ref: '#/components/schemas/ErrorInfo'
            - type: 'null'
      type: object
      required:
        - tool_name
        - result_summary
        - duration_ms
        - status
      title: CockpitChatToolLedgerPayload
      description: "Typed ``LedgerEntry.payload`` arm for cockpit_chat tool invocations.\n\
        \nStory 6.7. Every tool call from the Cockpit Chat agent \u2014\n`get_case`,\
        \ `get_reasoning_trace`, `re_run_agent`, `query_ledger` \u2014\nwrites one\
        \ of these. Architecture \xA7 P4 (tool calls ledgered) adapted\nfor the demo's\
        \ chat agent. Tool routes use the\n``ledger_chat_tool_call`` async context\
        \ manager (cockpit-api\nservices/cockpit_chat_ledger.py) to record entries."
    CommitDecisionRequest:
      properties:
        outcome:
          $ref: '#/components/schemas/DecisionOutcome'
        conditions:
          items:
            type: string
          type: array
          maxItems: 10
          title: Conditions
        rationale_html:
          type: string
          maxLength: 20000
          minLength: 20
          title: Rationale Html
      type: object
      required:
        - outcome
        - rationale_html
      title: CommitDecisionRequest
      description: POST body for ``/v1/cases/{case_id}/decisions``.
    CommitDecisionResponse:
      properties:
        case_id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Case Id
        decision_id:
          type: string
          minLength: 1
          title: Decision Id
        case_state:
          $ref: '#/components/schemas/CaseState'
        seal_at:
          type: string
          format: date-time
          title: Seal At
        ledger_entry_id:
          type: string
          maxLength: 30
          minLength: 30
          pattern: ^led_[0-9A-HJKMNP-TV-Z]{26}$
          title: Ledger Entry Id
      type: object
      required:
        - case_id
        - decision_id
        - case_state
        - seal_at
        - ledger_entry_id
      title: CommitDecisionResponse
      description: 201 response shape for ``POST /v1/cases/{case_id}/decisions``.
    ConfidenceBand:
      type: string
      enum:
        - low
        - medium_low
        - medium_high
        - high
      title: ConfidenceBand
      description: Four-tier confidence banding. Wire format is snake_case.
    ConfidenceWithRationale:
      properties:
        value:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Value
        rationale:
          type: string
          maxLength: 400
          minLength: 12
          title: Rationale
        band:
          $ref: '#/components/schemas/ConfidenceBand'
      type: object
      required:
        - value
        - rationale
        - band
      title: ConfidenceWithRationale
      description: 'Confidence float with an agent-emitted rationale string.


        Used inside `ReasoningTrace.confidence_self_rating`. Re-usable by

        future agents needing a richer "why this confidence?" signal than

        `ProvenancedField[T]` provides.'
    CustomerMetadata:
      properties:
        customer_name:
          type: string
          minLength: 1
          title: Customer Name
        customer_type:
          anyOf:
            - type: string
              enum:
                - individual
                - company
            - type: 'null'
          title: Customer Type
        country:
          anyOf:
            - type: string
            - type: 'null'
          title: Country
        extra:
          additionalProperties: true
          type: object
          title: Extra
      type: object
      required:
        - customer_name
      title: CustomerMetadata
      description: 'Customer-side facts attached to a case.


        ``extra`` is an extensibility escape hatch so fixtures (Story 2-4) can carry

        demo-only fields without schema churn. Production code should prefer named

        fields over ``extra`` once the bank-buyer scope revives.'
    DecisionOutcome:
      type: string
      enum:
        - approve
        - decline
        - approve_with_conditions
        - escalate_to_edd
      title: DecisionOutcome
      description: "The four mutually-exclusive decision outcomes \u2014 Story 7.9\
        \ / AC #1.\n\nStory 7.7 declared this as a ``Literal``; promoting to ``StrEnum``\n\
        keeps the wire format identical (Pydantic v2 serializes by value)\nand lets\
        \ Python callers reach for ``DecisionOutcome.APPROVE``\ninstead of stringly-typed\
        \ literals."
    DecisionSealedPayload:
      properties:
        kind:
          type: string
          const: decision_sealed
          title: Kind
          default: decision_sealed
        decision_id:
          type: string
          minLength: 1
          title: Decision Id
        outcome:
          type: string
          enum:
            - approve
            - decline
            - approve_with_conditions
            - escalate_to_edd
          title: Outcome
      type: object
      required:
        - decision_id
        - outcome
      title: DecisionSealedPayload
      description: "Typed ``LedgerEntry.payload`` arm for the SYSTEM-emitted seal\
        \ \u2014\nStory 7.7. Written by ``decision_service.seal_decision`` when\n\
        Story 7.4's timer elapses; ``actor_type`` is ``SYSTEM`` and\n``actor_id``\
        \ is ``platform``. Distinct from agent / officer entries."
    DocumentIntelligenceInput:
      properties:
        case_id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Case Id
        document_refs:
          items:
            type: string
            minLength: 1
          type: array
          minItems: 0
          title: Document Refs
      type: object
      required:
        - case_id
        - document_refs
      title: DocumentIntelligenceInput
    DocumentIntelligenceOutput:
      properties:
        case_id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Case Id
        extracted_fields:
          items:
            $ref: '#/components/schemas/ExtractedField'
          type: array
          title: Extracted Fields
      type: object
      required:
        - case_id
      title: DocumentIntelligenceOutput
      description: "Aggregate of ExtractedFields across all input document_refs.\n\
        \nNote (Story 3.4 \xA7 AC8): ``evidence_ids`` inside each ``ExtractedField.value``\n\
        are empty when the agent returns. The supervisor (Story 3-5) back-fills\n\
        them with the agent's own ledger-entry ID after ``@agent_action`` writes\n\
        the entry."
    DraftedRationale:
      properties:
        case_id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Case Id
        html:
          type: string
          minLength: 20
          title: Html
        paragraphs:
          items:
            type: string
          type: array
          maxItems: 4
          minItems: 2
          title: Paragraphs
        cited_claims:
          items:
            $ref: '#/components/schemas/CitedClaim'
          type: array
          title: Cited Claims
        model_id:
          type: string
          minLength: 1
          title: Model Id
        prompt_template_id:
          type: string
          const: rationale_draft_v1
          title: Prompt Template Id
          default: rationale_draft_v1
      type: object
      required:
        - case_id
        - html
        - paragraphs
        - model_id
      title: DraftedRationale
      description: "The Writing agent's output \u2014 a structured rationale with\n\
        citations.\n\n``html`` is the renderable form for Tiptap (citation tokens\
        \ already\nwrapped in ``<span data-ledger-id=\"\u2026\">\u2026</span>``).\
        \ ``paragraphs``\nand ``cited_claims`` carry the structured signal for downstream\n\
        analytics \u2014 they are persisted on the intake row but not surfaced\nin\
        \ the demo UI."
    EntityVerificationInput:
      properties:
        case_id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Case Id
        cin:
          type: string
          maxLength: 21
          minLength: 21
          pattern: ^[LU]\d{5}[A-Z]{2}\d{4}[A-Z]{3}\d{6}$
          title: Cin
      type: object
      required:
        - case_id
        - cin
      title: EntityVerificationInput
    EntityVerificationResult:
      properties:
        case_id:
          type: string
          maxLength: 31
          minLength: 31
          pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
          title: Case Id
        cin:
          type: string
          title: Cin
        mca_status:
          $ref: '#/components/schemas/ProvenancedField_Literal__active____struck_off____dormant___'
        mismatches:
          items:
            $ref: '#/components/schemas/FieldMismatch'
          type: array
          title: Mismatches
      type: object
      required:
        - case_id
        - cin
        - mca_status
      title: EntityVerificationResult
    ErrorInfo:
      properties:
        type:
          type: string
          minLength: 1
          title: Type
        message:
          type: string
          maxLength: 500
          title: Message
      type: object
      required:
        - type
        - message
      title: ErrorInfo
      description: Error metadata recorded on failure-path agent actions.
    ExtractedField:
      properties:
        field_name:
          type: string
          minLength: 1
          title: Field Name
        document_ref:
          type: string
          minLength: 1
          title: Document Ref
        value:
          $ref: '#/components/schemas/ProvenancedField_Union_str__int__float__bool__NoneType__'
      type: object
      required:
        - field_name
        - document_ref
        - value
      title: ExtractedField
    FieldMismatch:
      properties:
        field_name:
          type: string
          minLength: 1
          title: Field Name
        case_value:
          anyOf:
            - type: string
            - type: 'null'
          title: Case Value
        mca_value:
          anyOf:
            - type: string
            - type: 'null'
          title: Mca Value
        severity:
          type: string
          enum:
            - info
            - warning
            - critical
          title: Severity
          default: warning
        notes:
          anyOf:
            - type: string
            - type: 'null'
          title: Notes
      type: object
      required:
        - field_name
      title: FieldMismatch
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LearningEventInput:
      properties:
        edge_kind:
          type: string
          enum:
            - owns
            - director
            - beneficial
          title: Edge Kind
        from_id:
          type: string
          maxLength: 72
          minLength: 7
          pattern: ^ubo_(p|e)_[A-Za-z0-9_-]{1,64}$
          title: From Id
        original_to_id:
          type: string
          maxLength: 72
          minLength: 7
          pattern: ^ubo_(p|e)_[A-Za-z0-9_-]{1,64}$
          title: Original To Id
        new_to_id:
          type: string
          maxLength: 72
          minLength: 7
          pattern: ^ubo_(p|e)_[A-Za-z0-9_-]{1,64}$
          title: New To Id
        correction_tag:
          type: string
          enum:
            - real_ubo
            - nominee
            - director
            - removed
          title: Correction Tag
        evidence_note:
          type: string
          maxLength: 500
          minLength: 1
          title: Evidence Note
        opt_in_for_retraining:
          type: boolean
          title: Opt In For Retraining
          default: false
      type: object
      required:
        - edge_kind
        - from_id
        - original_to_id
        - new_to_id
        - correction_tag
        - evidence_note
      title: LearningEventInput
      description: POST body for ``/v1/cases/{case_id}/ubo/learning-events``.
    LearningEventLedgerPayload:
      properties:
        kind:
          type: string
          const: learning_event
          title: Kind
          default: learning_event
        edge_kind:
          type: string
          enum:
            - owns
            - director
            - beneficial
          title: Edge Kind
        from_id:
          type: string
          minLength: 1
          title: From Id
        original_to_id:
          type: string
          minLength: 1
          title: Original To Id
        new_to_id:
          type: string
          minLength: 1
          title: New To Id
        correction_tag:
          type: string
          enum:
            - real_ubo
            - nominee
            - director
            - removed
          title: Correction Tag
        evidence_note:
          type: string
          title: Evidence Note
        opt_in_for_retraining:
          type: boolean
          title: Opt In For Retraining
      type: object
      required:
        - edge_kind
        - from_id
        - original_to_id
        - new_to_id
        - correction_tag
