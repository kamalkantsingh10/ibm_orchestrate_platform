      description: "One append-only ledger event.\n\nThe writer overwrites ``id``\
        \ and ``recorded_at`` server-side at\n``append`` time, so caller-supplied\
        \ values are ignored. Pass any\npattern-valid ID and any tz-aware ``datetime``\
        \ \u2014 they will be replaced."
