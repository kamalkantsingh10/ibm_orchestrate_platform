      description: Server-side response after persisting + writing the ledger entry.
    LedgerEntry:
      properties:
        id:
          type: string
          maxLength: 30
          minLength: 30
          pattern: ^led_[0-9A-HJKMNP-TV-Z]{26}$
          title: Id
        actor_type:
          $ref: '#/components/schemas/ActorType'
        actor_id:
          type: string
          minLength: 1
          title: Actor Id
        case_id:
          anyOf:
            - type: string
              maxLength: 31
              minLength: 31
              pattern: ^case_[0-9A-HJKMNP-TV-Z]{26}$
