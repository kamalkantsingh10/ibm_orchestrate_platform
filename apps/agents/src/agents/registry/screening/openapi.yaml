      properties:
        case_id:
          type: string
          title: Case Id
        items:
          items:
            $ref: '#/components/schemas/StoredDocumentResponse'
          type: array
          title: Items
      type: object
      required:
        - case_id
        - items
      title: ListResponse
      description: Reply to GET /documents.
    OfficerDecisionCommittedPayload:
      properties:
        kind:
          type: string
          const: officer_decision_committed
          title: Kind
          default: officer_decision_committed
        decision_id:
          type: string
          minLength: 1
          title: Decision Id
        outcome:
          type: string
          enum:
            - approve
            - decline
            - approve_with_conditions
            - escalate_to_edd
          title: Outcome
        conditions:
          items:
            type: string
          type: array
          title: Conditions
        rationale_hash:
          type: string
          maxLength: 64
          minLength: 64
          title: Rationale Hash
      type: object
      required:
        - decision_id
        - outcome
        - rationale_hash
      title: OfficerDecisionCommittedPayload
      description: "Typed ``LedgerEntry.payload`` arm for officer commits \u2014 Story\
        \ 7.7.\n\nNo Ed25519 signature: the bank-buyer scope's signing primitive is\n\
        cut from the demo per the 2026-04-29 re-scope. The audit anchor is\nthe ``rationale_hash``\
        \ (SHA-256 hex of the raw ``rationale_html``\nUTF-8 bytes); changing the rationale\
        \ post-hoc would invalidate the\nhash without rewriting the ledger entry."
    OfficerDecisionUndonePayload:
      properties:
        kind:
          type: string
          const: officer_decision_undone
          title: Kind
          default: officer_decision_undone
        decision_id:
          type: string
          minLength: 1
          title: Decision Id
        reason:
          type: string
          maxLength: 2000
          minLength: 40
          title: Reason
      type: object
      required:
        - decision_id
        - reason
      title: OfficerDecisionUndonePayload
      description: "Typed ``LedgerEntry.payload`` arm for officer undo events.\n\n\
        Story 7.5. Officer hits Undo on a pending_seal decision; we cancel\nStory\
        \ 7.4's timer, revert the case to ``decision_ready``, and write\none of these.\
        \ The reason is required (\u2265 40 chars) so the audit\nrecord carries the\
        \ why; NFR-T6 carries through demo scope."
