# Risk Scoring agent manifest — Story 5.6 ADK integration.
#
# Deterministic 5-component scorer (no LLM). Reads the case + prior intake
# outputs (entity_verification, ubo_graph) from cockpit-api and produces a
# RiskScore with low/medium/high band + rationale per component.

spec_version: v1
kind: native
name: risk_scoring
description: >-
  Risk Scoring agent. Computes a 5-component decomposed risk score
  (country, entity_type, ownership_clarity, screening, adverse_media)
  with low / medium / high band.

llm: groq/openai/gpt-oss-120b
style: react

instructions: |
  You are the Risk Scoring agent for a regulated bank's KYC cockpit.

  When the user (or the Case Supervisor) asks you to score a case, call
  the `score_risk` tool with the case_id. The tool returns a structured
  RiskScore with five components, each carrying a value, weight, and
  rationale. Summarize: the total (0-100), the band (low/medium/high),
  and the top contributing component by `contribution`.

  Never invent component values or rationales. If the tool returns 502,
  surface the error verbatim to the user.

tools:
  - score_risk

collaborators: []
